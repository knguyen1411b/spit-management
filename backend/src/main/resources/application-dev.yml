application:
  admin:
    username: ${SUPER_USER_USERNAME}
    password: ${SUPER_USER_PASSWORD}
  security:
    jwt:
      secretKey: ${JWT_SECRET}
      accessTokenExpiration: ${JWT_ACCESS_EXPIRATION}
      refreshTokenExpiration: ${JWT_REFRESH_EXPIRATION}

cloudinary:
  cloudName: ${CLOUDINARY_CLOUD_NAME}
  apiKey: ${CLOUDINARY_API_KEY}
  apiSecret: ${CLOUDINARY_API_SECRET}

spring:
  application:
    name: ${APPLICATION_NAME:ServerApplication}

  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  task:
    execution:
      pool:
        core-size: ${THREAD_POOL_CORE_SIZE:5}
        max-size: ${THREAD_POOL_MAX_SIZE:10}
        queue-capacity: ${THREAD_POOL_QUEUE_CAPACITY:25}

springdoc:
  swagger-ui:
    default-model-expand-depth: 0
    defaultModelsExpandDepth: 0
    tags-sorter: alpha

server:
  port: ${PORT:8080}
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:50}
      min-spare: ${TOMCAT_MIN_SPARE_THREADS:10}
      max-queue-capacity: ${TOMCAT_MAX_QUEUE_CAPACITY:100}
